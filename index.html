        async function searchSpotifyLive(query) {
            const token = await getSpotifyToken();
            if (!token) return [];
            try {
                const res = await fetch(
                    'https://api.spotify.com/v1/search?q=' + encodeURIComponent(query) + '&type=artist&limit=10',
                    { headers: { 'Authorization': 'Bearer ' + token } }
                );
                if (!res.ok) {
                    console.warn('Spotify search error status:', res.status);
                    return [];
                }
                const data = await res.json();
                const items = data.artists?.items || [];
                return items.map(a => {
                    const art = {
                        id: 'sp_' + a.id,
                        spotifyId: a.id,
                        nombre: a.name,
                        genero: a.genres?.slice(0, 2).join(' / ') || 'Sin género clasificado',
                        img: a.images?.[a.images.length > 1 ? a.images.length - 1 : 0]?.url || a.images?.[0]?.url || null,

                        popularidad: a.popularity != null ? a.popularity : 0,

                        spotifyUrl: a.external_urls?.spotify,
                        isLive: true
                    };
                    liveArtistsRegistry[art.id] = art;
                    return art;
                });

                console.warn('Spotify search error:', e);

        // --- MOTOR DE DIAGNÓSTICO AVANZADO ---
        function generarDiagnosticoAvanzado(projectData, selectedRefNames) {
            const genero = projectData.generoPrincipal;
            const esUrbanoORegional = /Urbano|Hip-Hop|Corridos|R&B|Reggaetón/i.test(genero);
            const esElectronica = /Synth-Pop|House|Hyperpop|Electrónica/i.test(genero);

            let score = 40;
            if (projectData.spotify) score += 20;
            if (projectData.igScreenshot) score += 15;
            if (selectedRefNames.length >= 3) score += 15;
            if (projectData.subgeneros.trim().length > 2) score += 10;

            const publicoMeta = {
                edad: esUrbanoORegional ? '16 - 24 años (Gen Z)' : esElectronica ? '20 - 30 años (Gen Z / Millennial)' : '18 - 27 años (Universitarios y jóvenes adultos)',
                ciudades: esUrbanoORegional
                    ? 'CDMX, Monterrey, Guadalajara, Tijuana y Culiacán'
                    : 'CDMX, Guadalajara, Monterrey, Puebla y Querétaro (expansión a Bogotá y Santiago)',
                horariosPico: esElectronica ? 'Jueves a Sábado (9:00 PM - 2:00 AM)' : 'Lunes a Viernes (7:00 PM - 11:30 PM) y traslados',
                comportamiento: esUrbanoORegional
                    ? 'Descubrimiento acelerado en TikTok y playlists de estado de ánimo. Alta interacción en comentarios y compartidos por WhatsApp/IG Stories.'
                    : 'Escucha activa por álbum/EP, guarda canciones en playlists personales de nicho y valora la estética visual y el proceso creativo detrás del artista.',
                interesesCruzados: [
                    `Oyentes activos de ${selectedRefNames[0] || 'la escena alternativa'}`,
                    projectData.subgeneros ? `Etiquetas: ${projectData.subgeneros}` : `Escena ${genero} independiente`,
                    'Festivales locales, moda streetwear/vintage, fotografía analógica y cultura visual'
                ]
            };

            const algoritmos = [
                {
                    plataforma: 'Spotify (Radio y Discover Weekly)',
                    afinidad: projectData.spotify ? 'Alta (Perfil listo para entrenar)' : 'Pendiente (Falta conectar perfil)',
                    senalesClave: 'Tasa de guardados > 30% y Skip Rate < 25% en los primeros 30 segundos.',
                    accion: `Usa a ${selectedRefNames.slice(0, 2).join(' y ') || 'tus referentes'} como puente: busca entrar a playlists independientes donde ellos ya aparezcan para entrenar el algoritmo de "Los fans también escuchan".`
                },
                {
                    plataforma: 'TikTok & Instagram Reels',
                    afinidad: 'Muy Alta (Motor principal de descubrimiento)',
                    senalesClave: 'Retención en los primeros 3 segundos, repeticiones (loops) y guardados del video.',
                    accion: `Publica micro-piezas de 15-20s enfocadas en el clímax emocional de tu canción (${genero}). Evita intros largos y usa texto en pantalla que conecte con el mood de tu público meta.`
                },
                {
                    plataforma: 'YouTube & Shorts',
                    afinidad: 'Media-Alta (Fidelización y búsqueda)',
                    senalesClave: 'Porcentaje de reproducción promedio y clics desde Shorts hacia el video oficial o sesión en vivo.',
                    accion: 'Sube Visualizers en loop o sesiones acústicas crudas. El algoritmo de YouTube premia el tiempo de sesión y posiciona muy bien búsquedas tipo "similar a [Referente]".'
                }
            ];

            const riesgos = [];
            if (!projectData.spotify) {
                riesgos.push('No ingresaste link de Spotify/YouTube: sin catálogo indexado o Spotify for Artists activo, pierdes el acceso a Release Radar.');
            }
            if (!projectData.igScreenshot) {
                riesgos.push('Sin auditoría visual de Instagram: si tu bio no tiene un enlace directo (Linktree/Smartlink) y una estética coherente, el tráfico de TikTok no convertirá en seguidores.');
            }
            if (projectData.presupuesto.includes('$0')) {
                riesgos.push('Presupuesto Guerrilla ($0): dependerás 100% de volumen orgánico (mínimo 4-5 videos por semana) y colaboraciones con otros artistas locales de tu mismo nivel.');
            }
            if (projectData.etapa.includes('Iniciando')) {
                riesgos.push('Etapa Inicial: evita lanzar un álbum completo de golpe. El algoritmo premia la constancia; lanza sencillos cada 5 a 6 semanas para acumular señales.');
            }

            return { score, publicoMeta, algoritmos, riesgos };
        }

            if (projInput && pinInput) {
                state.auth.proyecto = projInput.value.trim();

                if (state.auth.proyecto && state.auth.pin.length === 4) {

            }

            if (file) {
                state.igFile = file;
                const reader = new FileReader();
                reader.onload = function (e) {
                    state.projectData.igScreenshot = e.target.result;
                    state.projectData.igScreenshotName = file.name;
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = (error) => reject(error);
        });

            state.loading = true;
            state.errorMsg = '';

                .filter(Boolean);

                if (state.igFile) {
                    igImageBase64 = await fileToBase64(state.igFile);
                    igImageMimeType = state.igFile.type;
                }

                const res = await fetch('/api/analizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        proyecto: state.auth.proyecto,
                        projectData: state.projectData,
                        referentes: selectedRefNames,
                        igImageBase64,
                        igImageMimeType
                    })
                });

                const data = await res.json();
                if (!data.ok) throw new Error(data.error || 'Error al conectar con la API.');

                state.aiDiagnostico = data.diagnostico;
                state.step = 3;
            } catch (err) {
                console.warn('Modo estático / API Route no disponible, usando motor local enriquecido:', err);
                const localDiag = generarDiagnosticoAvanzado(state.projectData, selectedRefNames);
                if (state.projectData.igScreenshot) {

                                            <p class="text-sm font-sans text-zinc-200 font-semibold">${diagnostico.publicoMeta.ciudades}</p>
                                        </div>
                                        <div class="bg-cyber-950/90 border border-cyber-cyan/20 p-4 rounded-xl">
                                            <p class="text-[10px] uppercase font-mono font-bold text-cyber-cyan mb-1 flex items-center gap-1.5">
                                                ${ICONS.clock} HORARIOS PICO DE TRANSMISIÓN
                                            </p>
                                            <p class="text-sm font-sans text-zinc-200">${diagnostico.publicoMeta.horariosPico}</p>
                                        </div>
                                    </div>

                                    <div class="space-y-4">
                                        <div class="bg-cyber-950/90 border border-cyber-pink/20 p-4 rounded-xl">
                                            <p class="text-[10px] uppercase font-mono font-bold text-cyber-pink mb-1 flex items-center gap-1.5">
                                                <span class="w-1.5 h-1.5 rounded-full bg-cyber-pink"></span>
                                                PSICOGRAFÍA Y COMPORTAMIENTO
                                            </p>
                                            <p class="text-xs font-sans text-zinc-300 leading-relaxed">${diagnostico.publicoMeta.comportamiento}</p>
                                        </div>
                                        <div class="bg-cyber-950/90 border border-cyber-pink/20 p-4 rounded-xl">
                                            <p class="text-[10px] uppercase font-mono font-bold text-cyber-pink mb-2 flex items-center gap-1.5">
                                                <span class="w-1.5 h-1.5 rounded-full bg-cyber-pink"></span>
                                                INTERESES CRUZADOS (SEGMENTACIÓN Y CONTENIDO)
                                            </p>
                                            <ul class="space-y-2">
                                                ${interesesHtml}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 3. AFINIDAD Y ESTRATEGIA ALGORÍTMICA -->
                            <div class="cyber-glass border border-cyber-cyan/30 rounded-2xl p-6 shadow-[0_0_30px_rgba(0,0,0,0.6)]">
                                <h2 class="text-xl font-orbitron font-bold mb-2 flex items-center gap-2 text-white">
                                    ${ICONS.cpu} Estrategia de Algoritmos por Plataforma
                                </h2>
                                <p class="text-xs font-mono text-zinc-400 mb-5">
                                    Protocolo de activación de señales en los motores de recomendación para <strong class="text-cyber-cyan">${state.projectData.generoPrincipal}</strong>.
                                </p>

                                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                                    ${algoritmosHtml}
                                </div>
                            </div>

                            <!-- 4. FORTALEZAS VS RIESGOS DE FLOP -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="cyber-glass border border-cyber-neonGreen/40 p-6 rounded-2xl shadow-[0_0_20px_rgba(0,255,136,0.1)]">
                                    <h3 class="text-cyber-neonGreen font-orbitron font-bold mb-4 flex items-center gap-2 text-base">
                                        ${ICONS.checkGreen} Ventajas Competitivas Detectadas
                                    </h3>
                                    <ul class="space-y-3 text-xs font-sans text-zinc-200 leading-relaxed">
                                        <li class="flex items-start gap-2.5">
                                            <span class="text-cyber-neonGreen font-bold font-mono">▶</span>
                                            <span>Clúster estilístico en <strong>${state.projectData.generoPrincipal}</strong> anclado a <strong>${selectedRefNames.join(', ') || 'tus referentes'}</strong>.</span>
                                        </li>
                                        ${state.projectData.igScreenshot ? `
                                            <li class="flex items-start gap-2.5">
                                                <span class="text-cyber-neonGreen font-bold font-mono">▶</span>
                                                <span>Telemetría de Instagram procesada: listo para reestructurar bio, destacados y paleta visual del feed.</span>
                                            </li>
                                        ` : ''}
                                        <li class="flex items-start gap-2.5">
                                            <span class="text-cyber-neonGreen font-bold font-mono">▶</span>
                                            <span>Alta afinidad para formatos cortos de guerrilla con ganchos de retención superiores a 3 segundos.</span>
                                        </li>
                                    </ul>
                                </div>

                                <div class="cyber-glass border border-red-500/50 p-6 rounded-2xl shadow-[0_0_20px_rgba(239,68,68,0.15)]">
                                    <h3 class="text-red-400 font-orbitron font-bold mb-4 flex items-center gap-2 text-base">
                                        ${ICONS.shieldAlert} Riesgos de Flop y Brechas Críticas
                                    </h3>
                                    <ul class="space-y-3">
                                        ${riesgosHtml}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // TAB 2: PLAN DE CONTENIDO
                else if (state.activeTab === 'contenido') {
                    const firstRef = selectedRefNames[0] || 'tus referentes';
                    const itemsHtml = MOCK_PLAN_CONTENIDO.map((item, idx) => {
                        const dayColors = [
                            { border: 'border-cyber-cyan/40', text: 'text-cyber-cyan', bg: 'bg-cyber-cyan/10' },
                            { border: 'border-cyber-pink/40', text: 'text-cyber-pink', bg: 'bg-cyber-pink/10' },
                            { border: 'border-cyber-purple/40', text: 'text-cyber-purple', bg: 'bg-cyber-purple/10' },
                            { border: 'border-cyber-amber/40', text: 'text-cyber-amber', bg: 'bg-cyber-amber/10' }
                        ];
                        const c = dayColors[idx % dayColors.length];

                        return `
                            <div class="cyber-glass border ${c.border} rounded-2xl p-6 flex flex-col justify-between hover:shadow-[0_0_25px_rgba(0,240,255,0.2)] transition-all">
                                <div>
                                    <div class="flex items-center justify-between gap-2 mb-3">
                                        <span class="text-[10px] font-mono font-bold uppercase tracking-wider ${c.text} ${c.bg} px-3 py-1 rounded-full border ${c.border}">
                                            ${item.dia} • ${item.formato}
                                        </span>
                                        <span class="text-xs font-mono text-zinc-400">${item.pilar}</span>
                                    </div>

                                    <h3 class="text-base font-orbitron font-bold text-white mb-3 flex items-center gap-2">
                                        ${ICONS.playCircle}
                                        ${item.titulo}
                                    </h3>

                                    <div class="bg-cyber-950/90 border border-cyber-amber/40 rounded-xl p-4 mb-4 shadow-[0_0_15px_rgba(255,183,3,0.1)]">
                                        <p class="text-[10px] uppercase font-mono font-bold text-cyber-amber mb-1 flex items-center justify-between">
                                            <span class="flex items-center gap-1">${ICONS.sparkles} GANCHO HIPNÓTICO</span>
                                            <span class="text-[9px] text-zinc-500">[00:00 - 00:03s]</span>
                                        </p>
                                        <p class="text-xs font-sans text-zinc-100 italic leading-relaxed">
                                            "${item.gancho.replace('[Referente]', firstRef)}"
                                        </p>
                                    </div>

                                    <p class="text-xs font-sans text-zinc-300 leading-relaxed mb-4">
                                        <strong class="text-cyber-cyan font-mono uppercase tracking-wider">EJECUCIÓN:</strong> ${item.ejecucion}
                                    </p>
                                </div>

                                <div class="pt-3 border-t border-cyber-cyan/20 text-xs font-mono text-zinc-400 flex items-center justify-between">
                                    <span class="text-zinc-500 uppercase">OBJETIVO:</span>
                                    <span class="text-cyber-neonGreen font-semibold">${item.objetivo}</span>
                                </div>
                            </div>
                        `;
                    }).join('');

                    mainContentHtml = `
                        <div class="space-y-8 pb-12">
                            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-cyber-cyan/20 pb-6">
                                <div>
                                    <div class="font-mono text-[10px] text-cyber-cyan tracking-widest uppercase mb-1 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-cyber-cyan animate-ping"></span>
                                        // CRONOGRAMA DE ALTO IMPACTO ORGÁNICO
                                    </div>
                                    <h1 class="text-3xl font-orbitron font-black text-white tracking-wide">
                                        Plan de Contenido Semanal
                                    </h1>
                                    <p class="text-zinc-400 text-xs font-mono mt-1">
                                        Calibrado para <strong class="text-cyber-cyan">${state.auth.proyecto}</strong> aplicando patrones virales de ${firstRef}.
                                    </p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                }

                // TAB 3: ROADMAP DE LANZAMIENTO
                else if (state.activeTab === 'roadmap') {
                    const totalTasks = MOCK_ROADMAP.reduce((acc, fase) => acc + fase.tareas.length, 0);
                    const progressPercent = Math.round((state.completedTasks.length / totalTasks) * 100);

                    const roadmapBlocksHtml = MOCK_ROADMAP.map((bloque) => {
                        const tareasHtml = bloque.tareas.map(tarea => {
                            const isDone = state.completedTasks.includes(tarea.id);
                            return `
                                <button
                                    type="button"
                                    onclick="toggleTask('${tarea.id}')"
                                    class="w-full text-left flex items-start gap-3 p-3.5 rounded-xl border transition-all cursor-pointer ${isDone
                                    ? 'bg-cyber-950/60 border-cyber-neonGreen/30 text-zinc-500 line-through'
                                    : 'bg-cyber-950/90 border-cyber-cyan/25 text-zinc-200 hover:border-cyber-cyan hover:text-white hover:bg-cyber-cyan/5'
                                }"
                                >
                                    ${isDone ? ICONS.checkSquare : ICONS.square}
                                    <span class="text-xs font-sans leading-relaxed flex-1">${tarea.texto}</span>
                                </button>
                            `;
                        }).join('');

                        return `
                            <div class="cyber-glass border border-cyber-cyan/30 rounded-2xl p-6 shadow-[0_0_25px_rgba(0,0,0,0.5)]">
                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-cyber-cyan/20">
                                    <h3 class="text-base font-orbitron font-bold ${bloque.color} flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-cyber-cyan"></span>
                                        ${bloque.fase}
                                    </h3>
                                    <span class="text-xs font-mono text-cyber-cyan flex items-center gap-1.5 bg-cyber-950 px-3 py-1 rounded-full border border-cyber-cyan/30">
                                        ${ICONS.clock} ${bloque.tiempo}
                                    </span>
                                </div>
                                <div class="space-y-3">
                                    ${tareasHtml}
                                </div>
                            </div>
                        `;
                    }).join('');

                    mainContentHtml = `
                        <div class="space-y-8 pb-12">
                            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-cyber-cyan/20 pb-6">
                                <div>
                                    <div class="font-mono text-[10px] text-cyber-cyan tracking-widest uppercase mb-1 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-cyber-cyan animate-ping"></span>
                                        // PROTOCOLO DE DESPLIEGUE SECUENCIAL
                                    </div>
                                    <h1 class="text-3xl font-orbitron font-black text-white tracking-wide">
                                        Roadmap de Lanzamiento
                                    </h1>
                                    <p class="text-zinc-400 text-xs font-mono mt-1">
                                        Ajustado para modalidad: <span class="text-cyber-cyan font-bold">${state.projectData.presupuesto}</span>.
                                    </p>
                                </div>

                                <!-- Barra de Progreso HUD -->
                                <div class="cyber-glass border border-cyber-cyan/40 p-5 rounded-2xl min-w-[260px] shadow-[0_0_20px_rgba(0,240,255,0.15)]">
                                    <div class="flex justify-between items-center text-xs font-mono font-bold mb-2">
                                        <span class="text-zinc-400">DESPLIEGUE:</span>
                                        <span class="text-cyber-cyan font-orbitron text-sm">${progressPercent}%</span>
                                    </div>
                                    <div class="w-full bg-cyber-950 border border-zinc-800 h-2.5 rounded-full overflow-hidden">
                                        <div
                                            class="bg-gradient-to-r from-cyber-cyan via-cyber-purple to-cyber-pink h-full transition-all duration-300 shadow-[0_0_10px_rgba(0,240,255,0.7)]"
                                            style="width: ${progressPercent}%"
                                        ></div>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-6">
                                ${roadmapBlocksHtml}
                            </div>
                        </div>
                    `;
                }

                // TAB 4: DIRECTORIO DE MEDIOS
                else if (state.activeTab === 'medios') {
                    const mediosHtml = MOCK_MEDIOS_MEXICO.map(medio => `
                        <div class="cyber-glass border border-cyber-cyan/30 p-6 rounded-2xl flex flex-col md:flex-row gap-5 justify-between md:items-center hover:border-cyber-cyan/70 hover:shadow-[0_0_25px_rgba(0,240,255,0.2)] transition-all">
                            <div class="space-y-1.5">
                                <div class="flex items-center gap-3">
                                    <h3 class="font-orbitron font-bold text-lg text-white">${medio.nombre}</h3>
                                    <span class="text-[10px] font-mono bg-cyber-purple/20 text-cyber-purple border border-cyber-purple/40 px-2.5 py-1 rounded-full uppercase font-bold">
                                        ${medio.tipo}
                                    </span>
                                </div>
                                <p class="text-xs font-sans text-zinc-300">${medio.enfoque}</p>
                            </div>
                            <div class="bg-cyber-950/90 p-4 rounded-xl border border-cyber-cyan/20 md:w-2/5">
                                <p class="text-[10px] font-mono text-cyber-cyan uppercase font-bold mb-1 flex items-center gap-1.5">
                                    <span class="w-1.5 h-1.5 rounded-full bg-cyber-cyan"></span>
                                    PROTOCOLO DE PITCH
                                </p>
                                <p class="text-xs font-mono text-zinc-200">${medio.contacto}</p>
                            </div>
                        </div>
                    `).join('');

                    mainContentHtml = `
                        <div class="space-y-8 pb-12">
                            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-cyber-cyan/20 pb-6">
                                <div>
                                    <div class="font-mono text-[10px] text-cyber-cyan tracking-widest uppercase mb-1 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-cyber-cyan animate-ping"></span>
                                        // RED DE DIFUSIÓN & PRENSA
                                    </div>
                                    <h1 class="text-3xl font-orbitron font-black text-white tracking-wide">
                                        Directorio de Medios (México)
                                    </h1>
                                    <p class="text-zinc-400 text-xs font-mono mt-1">
                                        Curado para fase: <span class="text-cyber-cyan font-bold">${state.projectData.etapa}</span>.
                                    </p>
                                </div>
                            </div>

                            <div class="space-y-4">
                                ${mediosHtml}
                            </div>
                        </div>
                    `;
                }

                app.innerHTML = `
                    <div class="min-h-screen cyber-bg text-zinc-100 flex flex-col md:flex-row relative overflow-hidden font-sans">
                        <!-- Neon ambient lights -->
                        <div class="absolute top-0 right-1/4 w-96 h-96 bg-cyber-cyan/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="absolute bottom-10 left-10 w-96 h-96 bg-cyber-purple/10 rounded-full blur-3xl pointer-events-none"></div>

                        <!-- Sidebar Cyberpunk -->
                        <div class="w-full md:w-72 cyber-glass border-r border-cyber-cyan/30 p-6 flex flex-col justify-between shrink-0 relative z-20 backdrop-blur-2xl">
                            <div>
                                <div class="mb-8 pb-6 border-b border-cyber-cyan/20">
                                    <div class="text-[10px] font-orbitron font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyber-cyan to-cyber-pink uppercase mb-1">
                                        ANTI-FLOP // HUD
                                    </div>
                                    <h2 class="font-orbitron font-black text-2xl truncate text-white drop-shadow-[0_0_10px_rgba(0,240,255,0.4)]">
                                        ${state.auth.proyecto}
                                    </h2>
                                    <div class="inline-flex items-center gap-1.5 mt-2 px-2.5 py-1 rounded-full bg-cyber-neonGreen/10 border border-cyber-neonGreen/40 font-mono text-[11px] text-cyber-neonGreen">
                                        <span class="w-1.5 h-1.5 rounded-full bg-cyber-neonGreen animate-pulse"></span>
                                        ${state.projectData.generoPrincipal}
                                    </div>
                                </div>

                                <nav class="space-y-2">
                                    <button onclick="setActiveTab('diagnostico')" class="w-full flex items-center gap-3 p-3.5 rounded-xl text-xs font-mono font-bold uppercase tracking-wider transition-all cursor-pointer ${state.activeTab === 'diagnostico' ? 'border-l-4 border-l-cyber-cyan border-y border-r border-cyber-cyan/40 bg-cyber-cyan/15 text-cyber-cyan shadow-[0_0_20px_rgba(0,240,255,0.2)]' : 'text-zinc-400 hover:text-white hover:bg-cyber-cyan/5 hover:border hover:border-cyber-cyan/20 border border-transparent'}">
                                        ${ICONS.dashboard} Diagnóstico
                                    </button>
                                    <button onclick="setActiveTab('contenido')" class="w-full flex items-center gap-3 p-3.5 rounded-xl text-xs font-mono font-bold uppercase tracking-wider transition-all cursor-pointer ${state.activeTab === 'contenido' ? 'border-l-4 border-l-cyber-pink border-y border-r border-cyber-pink/40 bg-cyber-pink/15 text-cyber-pink shadow-[0_0_20px_rgba(255,0,127,0.2)]' : 'text-zinc-400 hover:text-white hover:bg-cyber-pink/5 hover:border hover:border-cyber-pink/20 border border-transparent'}">
                                        ${ICONS.instagramTab} Plan Contenido
                                    </button>
                                    <button onclick="setActiveTab('roadmap')" class="w-full flex items-center gap-3 p-3.5 rounded-xl text-xs font-mono font-bold uppercase tracking-wider transition-all cursor-pointer ${state.activeTab === 'roadmap' ? 'border-l-4 border-l-cyber-purple border-y border-r border-cyber-purple/40 bg-cyber-purple/15 text-cyber-purple shadow-[0_0_20px_rgba(157,78,221,0.2)]' : 'text-zinc-400 hover:text-white hover:bg-cyber-purple/5 hover:border hover:border-cyber-purple/20 border border-transparent'}">
                                        ${ICONS.calendar} Roadmap
                                    </button>
                                    <button onclick="setActiveTab('medios')" class="w-full flex items-center gap-3 p-3.5 rounded-xl text-xs font-mono font-bold uppercase tracking-wider transition-all cursor-pointer ${state.activeTab === 'medios' ? 'border-l-4 border-l-cyber-amber border-y border-r border-cyber-amber/40 bg-cyber-amber/15 text-cyber-amber shadow-[0_0_20px_rgba(255,183,3,0.2)]' : 'text-zinc-400 hover:text-white hover:bg-cyber-amber/5 hover:border hover:border-cyber-amber/20 border border-transparent'}">
                                        ${ICONS.megaphone} Directorio Medios
                                    </button>
                                </nav>
                            </div>

                            <div class="pt-6 border-t border-cyber-cyan/20 mt-6 space-y-3">
                                <div class="font-mono text-[10px] text-zinc-400 flex items-center justify-between">
                                    <span>LINK INTEGRITY:</span>
                                    <span class="text-cyber-neonGreen font-bold flex items-center gap-1">
                                        <span class="w-1.5 h-1.5 rounded-full bg-cyber-neonGreen animate-pulse"></span>
                                        100% ONLINE
                                    </span>
                                </div>
                                <button onclick="setStep(0); state.selectedRefIds = []; state.completedTasks = []; render();" class="w-full font-mono text-xs text-zinc-400 hover:text-red-400 py-2.5 px-3 rounded-lg border border-transparent hover:border-red-500/30 hover:bg-red-500/10 text-left transition-all flex items-center justify-between group cursor-pointer">
                                    <span>[ REBOOT TERMINAL ]</span>
                                    ${ICONS.lockSmall}
                                </button>
                            </div>
                        </div>

                        <!-- Contenido Principal -->
                        <div class="flex-1 p-6 md:p-10 overflow-y-auto h-screen relative z-10 custom-scroll">
                            ${mainContentHtml}
                        </div>
                    </div>
                `;
            }
        }

        // Iniciar la app
        window.addEventListener('DOMContentLoaded', () => {
            render();
            // Pre-autenticar con Spotify para mostrar el indicador verde
            getSpotifyToken().then(() => render());
        });
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            render();
            getSpotifyToken().then(() => render());
        }
    </script>
</body>

</html>
